<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project</title>

    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>

    <style>
       body {
            background-image: url("frozen_moments.jpg");
            background-repeat: no-repeat; 
            background-size: cover; 
            background-position: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            margin-bottom: 30px;
        }
        nav a {
            margin: 25px;
            color: floralwhite;
            font-weight: bold;
            font-size: 20px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: #947da7;
            padding: 10px;
            border-radius: 10px;
        }
       .container {
            background-color: rgb(138, 180, 217);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            color: floralwhite;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        h2 {
            color: floralwhite;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: floralwhite;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: goldenrod;
            color: floralwhite;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #947da7;
        }
        #sku_output {
            margin-top: 20px;
            padding: 15px;
            background: #e2ca52;
            border-left: 10px solid #947da7;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: floralwhite;
        }
    </style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>



</head>
<body>

    <nav>
        <a href="index.html">Receipt Generator</a> | 
        <a href="sku.html">SKU Generator</a>
    </nav>
<br> <br> 
    <div class="container">
        <h2>SKU Generator</h2>
        
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
                <option value="Pins">Pins</option>
                <option value="Keychains">Keychains</option>
                <option value="Standees">Standees</option>
                <option value="Sets">Sets</option>
                <option value="Plushies/Dolls">Plushies/Dolls</option>
            </select>
        </div>

        <div class="form-group">
            <label for="prod_name">Product Name</label>
            <input type="text" id="prod_name" placeholder="e.g., ZAYNE, VALKO">
        </div>

        <div class="form-group">
            <label for="quantity">Stock Quantity</label>
            <input type="number" id="quantity" placeholder="e.g., 15" min="0">
        </div>

        <button py-click="SKU_generator">Generate SKU</button>

        <div id="sku_output">Select which category, product name, and stock quantity you want to show the SKU!</div>
    </div>


    <script type="py" src="main.py" config='{"packages":[]}'></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
